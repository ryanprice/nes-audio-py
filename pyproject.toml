[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nesaudio"
version = "0.1.0"
description = "A Ricoh 2A03 (NES APU) synthesizer and tracker in numpy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["nes", "2a03", "chiptune", "apu", "famicom", "audio", "synthesis"]

[project.urls]
Homepage = "https://github.com/ryanprice/nes-audio-py"

[tool.setuptools.packages.find]
include = ["nesaudio*"]
